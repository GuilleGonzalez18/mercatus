name: Playwright E2E Tests
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  e2e:
    timeout-minutes: 30
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: ferco_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Backend
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: ferco_test
      PGUSER: postgres
      PGPASSWORD: testpass
      JWT_SECRET: test-secret-for-e2e-only
      CORS_ORIGIN: http://localhost:5173
      PORT: 3001
      # Frontend
      VITE_API_URL: http://localhost:3001/api
      # E2E credentials
      E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
      E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Setup database schema
        run: npm run db:schema
        working-directory: backend

      - name: Run migrations
        run: npm run db:migrate
        working-directory: backend

      - name: Seed test data
        run: npm run db:seed:test
        working-directory: backend

      - name: Start backend
        run: npm run start &
        working-directory: backend

      - name: Build frontend
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: http://localhost:3001/api

      - name: Start frontend preview
        run: npm run preview -- --port 5173 &
        working-directory: frontend

      - name: Wait for services
        run: npx wait-on http://localhost:3001/api/health http://localhost:5173 --timeout 60000

      - name: Run Playwright tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
